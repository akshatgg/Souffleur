name: Release

# Builds the installers and publishes them. This is the APP release only — the
# website deploys separately, on every push to master, and needs no version.
#
# Two ways to cut one, and you pick the version either way:
#
#   From your machine   npm run release:patch      (or :minor / :major)
#                       bumps package.json, tags, pushes, and this runs.
#
#   From GitHub         Actions -> Release -> Run workflow, and type a version
#                       such as 0.1.2. Leave it blank to build the installers
#                       without publishing anything.
#
# Either way the version comes from one place per run and package.json is
# brought into line with it, so a release cannot contain files named after a
# different version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.1.2 — leave blank to build without publishing'
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        name: Decide the version
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # Tag push: the tag is authoritative, and package.json must agree,
            # or the release would hold files named after another version.
            version="${GITHUB_REF_NAME#v}"
            publish=true
            if [ "$version" != "$pkg" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($pkg)."
              echo "::error::Run: npm version $version --no-git-tag-version, commit, then re-tag."
              exit 1
            fi
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"     # manual run, version given
            publish=true
          else
            version="$pkg"                      # manual run, build only
            publish=false
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version number. Use 0.1.2, not v0.1.2."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $version, publish $publish"

      - name: Refuse a version that already exists
        if: steps.decide.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.decide.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v${{ steps.decide.outputs.version }} already exists. Choose a higher version."
            exit 1
          fi

  macos:
    needs: [prepare]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installer filenames come from package.json, so align it with the
      # version this run decided before anything is built.
      - name: Set version to ${{ needs.prepare.outputs.version }}
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm ci

      # The audio tap and PDF reader are Swift, and exist only on macOS.
      - name: Build native helpers
        run: npm run build:native

      - name: Verify helpers were produced
        run: |
          test -x bin/audiotap || { echo "audiotap missing"; exit 1; }
          test -x bin/pdftext  || { echo "pdftext missing";  exit 1; }

      - run: npm test

      - name: Build DMGs
        run: npm run dist:mac

      - name: Verify the DMGs exist
        run: |
          ls -lh release/*.dmg
          test -n "$(ls release/*.dmg 2>/dev/null)" || { echo "no DMG produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg

  windows:
    needs: [prepare]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set version to ${{ needs.prepare.outputs.version }}
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - run: npm ci
      - run: npm test

      # No Swift on Windows, so no audio capture or PDF import there yet. The
      # app detects the missing helpers and says so rather than failing oddly.
      - name: Build installer
        run: npm run dist:win

      - name: Verify the installer exists
        shell: bash
        run: |
          ls -lh release/*.exe
          test -n "$(ls release/*.exe 2>/dev/null)" || { echo "no installer produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  release:
    needs: [prepare, macos, windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      # An empty release used to be reported only as a soft warning, so the job
      # went green having uploaded nothing. Fail instead.
      - name: Verify artifacts arrived
        run: |
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -print
          count=$(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) | wc -l)
          test "$count" -ge 3 || { echo "expected 3 installers, found $count"; exit 1; }

      # A manual run chose the version, so write it back to the repository and
      # create the tag. Pushes made with GITHUB_TOKEN do not trigger workflows,
      # so this cannot start a second release run.
      - name: Record the version in the repository
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          if [ "$(node -p "require('./package.json').version")" != "$v" ]; then
            git config user.name  "akshatgg"
            git config user.email "akshatgg@users.noreply.github.com"
            npm version "$v" --no-git-tag-version
            git commit -am "Release $v"
            git push origin master
          fi
          git tag -f "v$v"
          git push -f origin "v$v"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Souffleur ${{ needs.prepare.outputs.version }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — download the `.dmg` for your chip (`arm64` for Apple
            Silicon, the other for Intel) and drag Souffleur to Applications.

            macOS will say *"Apple could not verify Souffleur"*, offering only
            **Done** and **Move to Bin**. That is not a dead end: click **Done**,
            then open **System Settings → Privacy & Security**, scroll to the
            bottom, and click **Open Anyway**. Once only.

            Or clear the flag directly:
            `xattr -dr com.apple.quarantine /Applications/Souffleur.app`

            Then grant **Screen Recording** in System Settings → Privacy &
            Security. Without it the overlay runs but cannot see your screen or
            hear the call.

            **Windows** — run the `.exe`. SmartScreen will say it protected your
            PC; click **More info → Run anyway**.

            Audio capture is macOS-only for now.
