name: Release

# Tag a version to cut a release:
#   npm version patch && git push --follow-tags
#
# macOS and Windows each build on their own runner. Cross-building the Windows
# installer from a Mac needs Wine and produces something nobody has actually
# run; a Windows runner produces the artifact users will download.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The tag decides the version, but the filenames come from package.json. If
  # the two disagree you get a release called v0.2.0 containing files named
  # 0.1.1. Fail before spending ten minutes building the wrong thing.
  check-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag  package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            echo "::error::Run: npm version $tag --no-git-tag-version, then commit before tagging."
            exit 1
          fi

  macos:
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The audio tap and PDF extractor are Swift, and only exist on macOS.
      - name: Build native helpers
        run: npm run build:native

      - name: Verify helpers were produced
        run: |
          test -x bin/audiotap || { echo "audiotap missing"; exit 1; }
          test -x bin/pdftext  || { echo "pdftext missing";  exit 1; }

      - run: npm test

      # Use the npm script, not a bare electron-builder call: the script passes
      # --config, and without it the build silently falls back to defaults and
      # writes to dist/ under a different product name.
      - name: Build DMGs
        run: npm run dist:mac

      - name: Verify the DMGs exist
        run: |
          ls -lh release/*.dmg
          test -n "$(ls release/*.dmg 2>/dev/null)" || { echo "no DMG produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg

  windows:
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # No Swift on Windows, so no audio capture or PDF import there yet. The
      # app detects the missing helpers and says so rather than failing oddly.
      - name: Build installer
        run: npm run dist:win

      - name: Verify the installer exists
        shell: bash
        run: |
          ls -lh release/*.exe
          test -n "$(ls release/*.exe 2>/dev/null)" || { echo "no installer produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      # An empty release used to be reported only as a soft warning, so the job
      # went green having uploaded nothing. Fail instead.
      - name: Verify artifacts arrived
        run: |
          find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -print
          count=$(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) | wc -l)
          test "$count" -ge 3 || { echo "expected 3 installers, found $count"; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install

            **macOS** — download the `.dmg` for your chip (`arm64` for Apple
            Silicon, the other for Intel) and drag Souffleur to Applications.

            The build is signed, but not by a certificate Apple recognises, so
            macOS warns once. **Right-click the app and choose Open**, then Open
            again. If it still refuses: System Settings → Privacy & Security →
            **Open Anyway**.

            Then grant **Screen Recording** in System Settings → Privacy &
            Security. Without it the overlay runs but cannot see your screen or
            hear the call.

            **Windows** — run the `.exe`. SmartScreen will say it protected your
            PC; click **More info → Run anyway**.

            Audio capture is macOS-only for now.
