name: CI

# Every push and pull request. Until now the test suite only ran inside the
# release workflow, so a broken PR stayed green and was found at tag time.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The audio tap is Swift and exists only on macOS. PDF reading is
      # JavaScript now, so it needs no helper on any platform.
      - name: Build native helpers
        run: npm run build:native

      - name: Verify helpers were produced
        run: |
          test -x bin/audiotap || { echo "audiotap missing"; exit 1; }

      - run: npm test
